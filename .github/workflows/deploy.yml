name: Deploy a Cloudflare Pages

# Deploy automático en cada push a main. El paso final solo corre si existe el
# secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
# Sin el secret: gate corre igual y el deploy se salta (queda el wrangler manual).
# Nota: `secrets` es válido en if de STEP, NO en if de job (startup_failure).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate (lint + tipos + tests + build)
        run: |
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build
      - name: Wrangler deploy (solo si hay token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN sin configurar: se omite el deploy (queda el wrangler manual)."
            exit 0
          fi
          npx wrangler pages deploy out --project-name=maternidad-ar --branch=main --commit-dirty=true
